name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --test kat --test shake --test turboshake
      - run: cargo test --doc

  sbpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-build-sbf --version 4.2.0
      - run: cargo build-sbf --arch v3 --manifest-path program/Cargo.toml
      - run: cargo test --test sbpf -- --nocapture --test-threads=1

  # Fast proofs on every PR: the permutation (round equivalence under the
  # lane-complement mask), finalize/padding, rate_lanes/permute. The bounded
  # absorb/squeeze proofs run in kani-slow.yml.
  kani:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings --cfg solana_shake_kani
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.67.0'
          args: >-
            -Z stubbing
            --harness bertoni_round_equals_reference_round
            --harness complement_lanes_is_the_cs_involution
            --harness new_is_empty
            --harness finalize_
            --harness rate_lanes_and_permute_

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: formal_verification
        run: lake build
