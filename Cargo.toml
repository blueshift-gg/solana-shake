[package]
name = "solana-shake"
authors = ["Dean Little <@deanmlittle>"]
version = "0.1.0"
edition = "2024"
description = "A no_std, SVM-optimized SHAKE and TurboSHAKE library."
repository = "https://github.com/blueshift-gg/solana-shake"
license = "MIT"
keywords = ["shake128", "shake256", "keccak", "sha3", "solana"]
categories = ["cryptography", "no-std"]
readme = "README.md"
exclude = [".github/", ".gitignore", "tests/", "program/"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[features]
# Keccak-256 through the `sol_keccak256` syscall, and an XOF built on it.
keccak256 = ["dep:solana-define-syscall"]

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = { version = "5.1", optional = true }

[dev-dependencies]
sha3 = "0.10"
# The published predecessor: `tests/shake.rs` checks every SHAKE256 output
# path against it byte for byte.
solana-shake256 = "0.1.0"
mollusk-svm = "0.15.1"
solana-address = "2.6.1"
solana-instruction = "3.4.1"

[workspace]
members = ["program"]
default-members = ["."]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
